<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="container">
 
        <div class="lado-imagem"></div>
 
        <div class="lado-form">
            <h1>Tela de Cadastro</h1>


        <form>
            <label for="nome">E-mail ou Usuário</label>
            <input type="nome" id="nome" placeholder="Nome completo">

            <label for="E-mail">E-mail</label>
            <input type="email" id="email" placeholder="Digite um email valido">

            <label for="CPF">CPF</label>
            <input type="nome" id="CPF" placeholder="000.000.000-00">

            <label for="Celular">Celuldar</label>
            <input type="number" id="celuar" placeholder="Celular com o DDD">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <label for="data">Data de nascimento</label>
            <input type="date" id="data" placeholder="data de nascimento">

            <label for="genero">Gênero</label>
            <select id="genero" name="genero">
                <option value="">Selecione...</option>
                <option value="masculino">masculino</option>
                <option value="feminino">feminino</option>
                <option value="outros">outros</option>
                <option value="indefinido">indefinido</option>
            </select>

            <label class="termos">
                <input type="checkbox" id="termos" name="termos" required> Aceito os termos de uso
            </label>


            <button type="submit">Enviar</button>
            
        </form>

    </div>
</body>
</html>
